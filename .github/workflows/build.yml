name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  neoforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew
      - run: ./gradlew :neoforge-1.21.1:build --no-daemon --console=plain

  forge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge-1.20.1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon --console=plain
