name: Fabric 26.2 Port Build

on:
  push:
    branches: ["fabric-26.2-port", "fabric-26.2-faithful-port"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Fabric 26.2 module
        run: ./gradlew :fabric-26.2:build --stacktrace --warning-mode all

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-26.2-build-output
          path: |
            fabric-26.2/build/libs/*.jar
            fabric-26.2/build/reports/**
          if-no-files-found: ignore
