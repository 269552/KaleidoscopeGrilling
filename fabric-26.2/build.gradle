plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.2'
}

version = '1.1.1-fabric+mc26.2'
group = 'cn.breezeth'

base {
    archivesName = 'kaleidoscope_grilling'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.2'

    // Minecraft 26.2 uses Loom's non-remapping mode, so dependencies are regular
    // Gradle implementation/compileOnly configurations instead of modImplementation.
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.160.0+26.2'
    implementation 'fuzs.forgeconfigapiport:forgeconfigapiport-fabric:26.2.1'

    // Kaleidoscope Cookery Refabricated 1.4.1.5 for Minecraft 26.2.
    implementation 'curse.maven:kaleidoscope-cookery-refabricated-1394201:8684828'
}

sourceSets {
    main {
        java {
            srcDir "$buildDir/generated-port-src"
            srcDir 'src/main/java'
        }
        resources {
            srcDir '../common/src/main/resources'
            srcDir 'src/main/resources'
        }
    }
}

tasks.register('generatePortSources', Exec) {
    inputs.dir rootProject.file('neoforge-1.21.1/src/main/java')
    inputs.file file('port_transform.py')
    outputs.dir "$buildDir/generated-port-src"
    commandLine 'python3', file('port_transform.py').absolutePath,
            rootProject.file('neoforge-1.21.1/src/main/java').absolutePath,
            file("$buildDir/generated-port-src").absolutePath
}

tasks.named('compileJava') {
    dependsOn tasks.named('generatePortSources')
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(Jar).configureEach {
    archiveFileName = "kaleidoscope_grilling-${project.version}.jar"
    from(rootProject.file('LICENSE-CODE'))
    from(rootProject.file('LICENSE-ASSETS'))
    from(rootProject.file('NOTICE'))
}
