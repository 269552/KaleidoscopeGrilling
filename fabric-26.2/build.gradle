plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.2'
}

version = '1.1.1-fabric+mc26.2-preview1'
group = 'cn.breezeth'

base {
    archivesName = 'kaleidoscope_grilling'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.160.0+26.2'
    implementation 'fuzs.forgeconfigapiport:forgeconfigapiport-fabric:26.2.1'
    implementation 'curse.maven:kaleidoscope-cookery-refabricated-1394201:8684828'
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
        }
        resources {
            srcDir '../common/src/main/resources'
            srcDir 'src/main/resources'
            // Preview 1 deliberately omits legacy 1.21.1 datapack recipes until
            // their 26.2 serializers and ingredient references are ported.
            exclude 'data/**'
        }
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(Jar).configureEach {
    archiveFileName = "kaleidoscope_grilling-${project.version}.jar"
    from(rootProject.file('LICENSE-CODE'))
    from(rootProject.file('LICENSE-ASSETS'))
    from(rootProject.file('NOTICE'))
}
