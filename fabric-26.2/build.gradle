import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.2'
}

version = '1.1.1-fabric+mc26.2-preview4'
group = 'cn.breezeth'

base {
    archivesName = 'kaleidoscope_grilling'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.160.0+26.2'
    implementation 'fuzs.forgeconfigapiport:forgeconfigapiport-fabric:26.2.1'
    implementation 'curse.maven:kaleidoscope-cookery-refabricated-1394201:8684828'
}

def generatedPreviewResources = layout.buildDirectory.dir('generated-preview-resources')
def generatedPortedData = layout.buildDirectory.dir('generated-ported-data')

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
        }
        resources {
            srcDir 'src/main/resources'
            srcDir generatedPreviewResources
            srcDir generatedPortedData
        }
    }
}

tasks.register('generatePreviewItemDefinitions') {
    inputs.dir rootProject.file('common/src/main/resources/assets/kaleidoscope_grilling/models/item')
    outputs.dir generatedPreviewResources

    doLast {
        def modelDir = rootProject.file('common/src/main/resources/assets/kaleidoscope_grilling/models/item')
        def outRoot = generatedPreviewResources.get().asFile
        fileTree(modelDir).matching { include '*.json' }.files.each { modelFile ->
            def id = modelFile.name.substring(0, modelFile.name.length() - 5)
            def outFile = new File(outRoot, "assets/kaleidoscope_grilling/items/${id}.json")
            outFile.parentFile.mkdirs()
            outFile.text = """{
  \"model\": {
    \"type\": \"minecraft:model\",
    \"model\": \"kaleidoscope_grilling:item/${id}\"
  }
}
"""
        }
    }
}

tasks.register('generatePortedRecipes') {
    inputs.dir rootProject.file('common/src/main/resources/data/kaleidoscope_grilling/recipe')
    outputs.dir generatedPortedData

    doLast {
        def sourceRoot = rootProject.file('common/src/main/resources/data/kaleidoscope_grilling/recipe')
        def outRoot = generatedPortedData.get().asFile
        def acceptedTypes = [
                'minecraft:crafting_shaped',
                'minecraft:crafting_shapeless',
                'minecraft:smelting',
                'minecraft:smoking',
                'minecraft:campfire_cooking',
                'kaleidoscope_cookery:chopping_board',
                'kaleidoscope_cookery:millstone',
                'kaleidoscope_cookery:flex_pot',
                'kaleidoscope_cookery:flex_stockpot',
                'kaleidoscope_cookery:pot',
                'kaleidoscope_cookery:stockpot'
        ] as Set
        def slurper = new JsonSlurper()

        def ingredient = { value ->
            if (value instanceof Map) {
                if (value.item instanceof String) return value.item
                if (value.tag instanceof String) return '#' + value.tag
            }
            return value
        }

        fileTree(sourceRoot).matching { include '**/*.json' }.files.each { recipeFile ->
            def recipe = slurper.parse(recipeFile)
            if (!(recipe instanceof Map) || !acceptedTypes.contains(recipe.type)) return

            if (recipe.containsKey('ingredient')) recipe.ingredient = ingredient(recipe.ingredient)
            if (recipe.containsKey('carrier')) recipe.carrier = ingredient(recipe.carrier)
            if (recipe.ingredients instanceof List) {
                recipe.ingredients = recipe.ingredients.collect { ingredient(it) }
            }
            if (recipe.key instanceof Map) {
                recipe.key = recipe.key.collectEntries { k, v -> [(k): ingredient(v)] }
            }

            def relative = sourceRoot.toPath().relativize(recipeFile.toPath()).toString()
            def outFile = new File(outRoot, 'data/kaleidoscope_grilling/recipe/' + relative)
            outFile.parentFile.mkdirs()
            outFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(recipe)) + '\n'
        }
    }
}

processResources {
    dependsOn tasks.named('generatePreviewItemDefinitions')
    dependsOn tasks.named('generatePortedRecipes')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(rootProject.file('common/src/main/resources')) {
        exclude 'data/**'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "kaleidoscope_grilling-${project.version}.jar"
    from(rootProject.file('LICENSE-CODE'))
    from(rootProject.file('LICENSE-ASSETS'))
    from(rootProject.file('NOTICE'))
}
