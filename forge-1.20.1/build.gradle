plugins {
    id 'net.minecraftforge.gradle' version '6.0.53'
    id 'org.spongepowered.mixin' version '0.7.38'
}

apply from: file('../gradle/package-structure.gradle')

def props = new Properties()
file('gradle.properties').withInputStream { props.load(it) }

version = props.getProperty('mod_version')
group = props.getProperty('maven_group')

base { archivesName = props.getProperty('archives_base_name') }

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
    exclusiveContent {
        forRepositories(fg.repository)
        forRepository { maven { name = 'Create'; url = 'https://maven.createmod.net' } }
        filter {
            includeGroup 'com.simibubi.create'
            includeGroup 'net.createmod.ponder'
            includeGroup 'dev.engine-room.flywheel'
        }
    }
    exclusiveContent {
        forRepositories(fg.repository)
        forRepository { maven { name = 'Registrate'; url = 'https://maven.ithundxr.dev/mirror' } }
        filter { includeGroup 'com.tterrag.registrate' }
    }
    maven { url = 'https://api.modrinth.com/maven' }
    exclusiveContent {
        forRepositories(fg.repository)
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

sourceSets.main.resources.srcDir file('../common/src/main/resources')

minecraft {
    mappings channel: 'official', version: props.getProperty('minecraft_version')
    runs {
        configureEach {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--mixin', 'kaleidoscope_grilling.mixins.json'
        }
        client {
            workingDirectory project.file('runs/client')
            mods { kaleidoscope_grilling { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('runs/server')
            args '--nogui'
            mods { kaleidoscope_grilling { source sourceSets.main } }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${props.getProperty('minecraft_version')}-${props.getProperty('forge_version')}"
    implementation fg.deobf('maven.modrinth:v17FatAc:NXvhd04p')
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-common-api:15.20.0.105')
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-forge-api:15.20.0.105')
    compileOnly fg.deobf('maven.modrinth:jade:11.13.1+forge')
    runtimeOnly fg.deobf('maven.modrinth:jade:11.13.1+forge')
    def maid = "maven.modrinth:touhou-little-maid:${props.getProperty('touhou_little_maid_version')}"
    compileOnly fg.deobf(maid)
    if (!providers.gradleProperty('withoutMaid').isPresent()) {
        runtimeOnly fg.deobf(maid)
    }
    def createSlim = "com.simibubi.create:create-${props.getProperty('minecraft_version')}:${props.getProperty('create_version')}:slim"
    def ponder = "net.createmod.ponder:Ponder-Forge-${props.getProperty('minecraft_version')}:${props.getProperty('ponder_version')}"
    def flywheel = "dev.engine-room.flywheel:flywheel-forge-${props.getProperty('minecraft_version')}:${props.getProperty('flywheel_version')}"
    def registrate = "com.tterrag.registrate:Registrate:${props.getProperty('registrate_version')}"
    compileOnly(fg.deobf(createSlim)) { transitive = false }
    compileOnly fg.deobf(ponder)
    compileOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${props.getProperty('minecraft_version')}:${props.getProperty('flywheel_version')}")
    compileOnly fg.deobf(registrate)
    if (!providers.gradleProperty('withoutCreate').isPresent()) {
        runtimeOnly(fg.deobf(createSlim)) { transitive = false }
        runtimeOnly fg.deobf(ponder)
        runtimeOnly fg.deobf(flywheel)
        runtimeOnly fg.deobf(registrate)
    }
    compileOnly annotationProcessor('io.github.llamalad7:mixinextras-common:0.4.1')
    implementation 'io.github.llamalad7:mixinextras-forge:0.4.1'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'kaleidoscope_grilling.refmap.json'
    config 'kaleidoscope_grilling.mixins.json'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: inputs.properties.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

tasks.withType(Jar).configureEach {
    archiveFileName = "kaleidoscope_grilling-${project.version}-forge1.20.1.jar"
    manifest { attributes 'MixinConfigs': 'kaleidoscope_grilling.mixins.json' }
    from('../LICENSE-CODE')
    from('../LICENSE-ASSETS')
    from('../NOTICE')
}
