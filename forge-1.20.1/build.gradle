plugins {
    id 'net.minecraftforge.gradle' version '6.0.53'
    id 'org.spongepowered.mixin' version '0.7.38'
}

def props = new Properties()
file('gradle.properties').withInputStream { props.load(it) }

version = props.getProperty('mod_version')
group = props.getProperty('maven_group')

base { archivesName = props.getProperty('archives_base_name') }

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://api.modrinth.com/maven' }
    exclusiveContent {
        forRepositories(fg.repository)
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

sourceSets.main.resources.srcDir file('../common/src/main/resources')

minecraft {
    mappings channel: 'official', version: props.getProperty('minecraft_version')
    runs {
        configureEach {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--mixin', 'kaleidoscope_grilling.mixins.json'
        }
        client {
            workingDirectory project.file('runs/client')
            mods { kaleidoscope_grilling { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('runs/server')
            args '--nogui'
            mods { kaleidoscope_grilling { source sourceSets.main } }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${props.getProperty('minecraft_version')}-${props.getProperty('forge_version')}"
    implementation fg.deobf('maven.modrinth:v17FatAc:NXvhd04p')
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-common-api:15.20.0.105')
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-forge-api:15.20.0.105')
    compileOnly fg.deobf('maven.modrinth:jade:11.13.1+forge')
    runtimeOnly fg.deobf('maven.modrinth:jade:11.13.1+forge')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'kaleidoscope_grilling.refmap.json'
    config 'kaleidoscope_grilling.mixins.json'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: inputs.properties.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

tasks.withType(Jar).configureEach {
    archiveFileName = "kaleidoscope_grilling-${project.version}-forge1.20.1.jar"
    manifest { attributes 'MixinConfigs': 'kaleidoscope_grilling.mixins.json' }
    from('../LICENSE-CODE')
    from('../LICENSE-ASSETS')
    from('../NOTICE')
}
